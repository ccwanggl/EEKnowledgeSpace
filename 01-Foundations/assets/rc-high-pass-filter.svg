<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">一阶 RC 高通滤波器</title>
  <desc id="desc">输入经串联电容到输出节点，电阻从输出节点连接到地。</desc>
  <rect width="720" height="360" fill="#fffdf8"/>
  <g stroke="#172033" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="75" y1="145" x2="230" y2="145"/>
    <line x1="230" y1="105" x2="230" y2="185"/>
    <line x1="255" y1="105" x2="255" y2="185"/>
    <line x1="255" y1="145" x2="555" y2="145"/>
    <circle cx="405" cy="145" r="7" fill="#172033"/>
    <line x1="405" y1="145" x2="405" y2="175"/>
    <polyline points="405,175 375,195 435,220 375,245 435,270 405,290"/>
    <line x1="375" y1="290" x2="435" y2="290"/>
    <line x1="385" y1="305" x2="425" y2="305"/>
    <line x1="395" y1="320" x2="415" y2="320"/>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" fill="#172033">
    <text x="360" y="45" text-anchor="middle" font-size="26" font-weight="700">一阶 RC 高通滤波器</text>
    <text x="75" y="125" text-anchor="middle" font-size="21">Vᵢₙ</text>
    <text x="243" y="90" text-anchor="middle" font-size="23" font-weight="700" fill="#c2410c">C</text>
    <text x="455" y="235" font-size="23" font-weight="700">R</text>
    <text x="555" y="125" text-anchor="middle" font-size="21" fill="#c2410c">Vₒᵤₜ</text>
    <text x="360" y="345" text-anchor="middle" font-size="22">f꜀ = 1 / (2πRC)</text>
  </g>
</svg>
