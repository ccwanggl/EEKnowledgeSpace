<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">平行板电容器结构</title>
  <desc id="desc">两块面积为 A、间距为 d 的导体极板，中间填充介电常数为 epsilon 的绝缘介质。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fffdf8"/>
  <g font-family="Microsoft YaHei, sans-serif" fill="#172033">
    <text x="360" y="42" text-anchor="middle" font-size="26" font-weight="700">平行板电容器</text>
    <rect x="135" y="100" width="450" height="32" rx="5" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="135" y="278" width="450" height="32" rx="5" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="150" y="132" width="420" height="146" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="360" y="91" text-anchor="middle" font-size="18">上极板（导体，面积 A）</text>
    <text x="360" y="338" text-anchor="middle" font-size="18">下极板（导体，面积 A）</text>
    <text x="360" y="198" text-anchor="middle" font-size="21" font-weight="700" fill="#9a3412">绝缘介质</text>
    <text x="360" y="230" text-anchor="middle" font-size="18" fill="#9a3412">介电常数 ε = ε₀εᵣ</text>
    <line x1="625" y1="137" x2="625" y2="273" stroke="#b45309" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="646" y="211" font-size="20" fill="#92400e">d</text>
    <line x1="210" y1="100" x2="210" y2="65" stroke="#1d4ed8" stroke-width="4"/>
    <line x1="510" y1="310" x2="510" y2="345" stroke="#1d4ed8" stroke-width="4"/>
    <text x="360" y="390" text-anchor="middle" font-size="25" font-weight="700">C = εA / d = ε₀εᵣA / d</text>
  </g>
</svg>
