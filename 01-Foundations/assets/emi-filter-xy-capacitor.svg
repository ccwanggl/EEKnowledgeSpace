<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' width='800' height='520'>
  <style>.w{stroke:#333;stroke-width:2;fill:none;stroke-linecap:round}.t{font-family:sans-serif;fill:#333}</style>
  <!-- AC input L -->
  <text x='30' y='40' class='t' font-size='12' font-weight='bold'>L (Line)</text>
  <line class='w' x1='80' y1='35' x2='320' y2='35'/>
  <!-- AC input N -->
  <text x='30' y='100' class='t' font-size='12' font-weight='bold'>N (Neutral)</text>
  <line class='w' x1='80' y1='95' x2='320' y2='95'/>
  <!-- PE / Earth -->
  <text x='30' y='220' class='t' font-size='10' fill='#4CAF50' font-weight='bold'>PE (Earth)</text>
  <line class='w' x1='80' y1='215' x2='320' y2='215' stroke='#4CAF50'/>
  <!-- X capacitor L-N -->
  <line class='w' x1='160' y1='35' x2='160' y2='50'/>
  <line class='w' x1='160' y1='80' x2='160' y2='95'/>
  <line x1='140' y1='50' x2='180' y2='50' stroke='#D32F2F' stroke-width='2.5'/>
  <line x1='140' y1='58' x2='180' y2='58' stroke='#D32F2F' stroke-width='1.5'/>
  <text x='160' y='76' text-anchor='middle' class='t' font-size='10' fill='#D32F2F' font-weight='bold'>X Cap</text>
  <text x='160' y='200' text-anchor='middle' class='t' font-size='8' fill='#888'>(L-N, diff-mode)</text>
  <!-- Y capacitor L-PE -->
  <line class='w' x1='240' y1='35' x2='240' y2='50'/>
  <line class='w' x1='240' y1='80' x2='240' y2='215' stroke='#4CAF50'/>
  <line x1='225' y1='50' x2='255' y2='50' stroke='#E65100' stroke-width='2.5'/>
  <line x1='225' y1='58' x2='255' y2='58' stroke='#E65100' stroke-width='1.5'/>
  <text x='260' y='60' class='t' font-size='10' fill='#E65100' font-weight='bold'>Y Cap</text>
  <text x='255' y='160' class='t' font-size='8' fill='#888'>L-PE</text>
  <!-- Y capacitor N-PE -->
  <line class='w' x1='280' y1='95' x2='280' y2='130'/>
  <line class='w' x1='280' y1='160' x2='280' y2='215' stroke='#4CAF50'/>
  <line x1='265' y1='130' x2='295' y2='130' stroke='#E65100' stroke-width='2.5'/>
  <line x1='265' y1='138' x2='295' y2='138' stroke='#E65100' stroke-width='1.5'/>
  <text x='300' y='140' class='t' font-size='10' fill='#E65100' font-weight='bold'>Y Cap</text>
  <text x='295' y='175' class='t' font-size='8' fill='#888'>N-PE</text>
  <!-- Common-mode choke -->
  <rect x='100' y='26' width='12' height='78' fill='#f5f5f5' stroke='#333' stroke-width='1.5' rx='2'/>
  <text x='50' y='70' class='t' font-size='9' fill='#888'>CM Choke</text>
</svg>